{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Doctor Dashboard</h4>
                </div>
                <div class="card-body">
                    <div class="text-center">
                        <img src="{{ user.profile_picture.url }}"
                             alt="Profile Picture"
                             class="img-thumbnail mb-3"
                             style="max-width: 150px;">
                    </div>
                    <h5 class="text-center mb-4">Welcome Dr. {{ user.get_full_name }}</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
                        <li class="list-group-item"><strong>Address:</strong> {{ user.address_line1 }}</li>
                        <li class="list-group-item"><strong>City:</strong> {{ user.city }}</li>
                        <li class="list-group-item"><strong>State:</strong> {{ user.state }}</li>
                        <li class="list-group-item"><strong>Pincode:</strong> {{ user.pincode }}</li>
                    </ul>
                    <div class="text-center mt-4">
                        <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
